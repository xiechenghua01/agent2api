name: docker

# 构建 Agent2API 网关镜像并推送到 GitHub Container Registry（GHCR），
# 随后把仓库里的 docker-compose.yml 同步成刚构建好的镜像版本。
#
# ── 版本号取上游 tag，源码取本仓库 ───────────────────────────
# 镜像版本（镜像 tag 与 compose 里的版本）取上游 aimod-cc/agent2api 的最新
# tag；而构建用的源码是本仓库检出的那份，不是上游的 —— 只有这样，本仓库对
# Dockerfile 的修正才真能进镜像，否则每次都被上游原版覆盖回去（上游那份漏了
# ARG TARGETARCH，会导致 arm64 镜像里装着 x86-64 二进制）。
#
# 代价是镜像内容 = 上游 tag 对应的代码 + 本仓库补丁，与上游同 tag 的官方产物
# 并不等价。prepare 会打印上游 tag 的 commit 与本次构建的 commit，两边不一致
# 就明说，差异是看得见的。本仓库是 fork，也不该拿 fork 的 HEAD 当版本号。
#
# ── 触发方式 ──────────────────────────────────────────────────
#   · workflow_dispatch：手动触发，可指定 tag、可强制重建
#   · schedule：每天 03:00 UTC 检查上游是否出了新 tag，有则构建
#   · push：改到构建相关文件（工作流 / Dockerfile / 源码）时重建镜像
#
# ── 幂等 ──────────────────────────────────────────────────────
# 定时与手动触发下，先探测 GHCR 上是否已有该版本镜像，已有就跳过 —— 定时任务
# 不会每天空跑一次十几分钟的 Rust 编译。但 push 触发一律重建：那次改动本身就
# 说明构建输入变了，同版本号的旧镜像必须被覆盖掉。要绕开判断用 force 输入。
#
# ── 为什么不需要配置任何 secret ───────────────────────────────
# 推镜像用内置 GITHUB_TOKEN 的 packages: write，提交 compose 用它的
# contents: write。用 GITHUB_TOKEN 推送的提交不会触发新的 workflow run，
# 所以「同步 compose → 又触发构建」不会成环；提交信息里仍带 [skip ci]
# 作为双保险。
#
# ── 多架构 ────────────────────────────────────────────────────
# amd64 + arm64 一次构建，两个架构都注册 QEMU/binfmt。
#
# Rust 编译本身是交叉编译（builder 阶段 FROM --platform=$BUILDPLATFORM +
# rustup target），不经过 QEMU，所以这部分保持原生速度；但运行时阶段
# （FROM debian:bookworm-slim，要跑 apt-get 装 ca-certificates / curl）
# 没有声明 BUILDPLATFORM，构建 arm64 时那一层只能在 arm64 上执行 ——
# 也就是必须走 QEMU。少这一步的话 arm64 构建会直接报 exec format error。
#
# ── 镜像可见性 ────────────────────────────────────────────────
# 包随公开仓库默认为 public，所以 compose 拉取不需要任何凭据。

on:
  workflow_dispatch:
    inputs:
      version:
        description: '要构建的上游 tag（留空 = 自动取上游最新）'
        required: false
        type: string
      force:
        description: '强制重建（即使 GHCR 上已有该版本）'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 3 * * *'
  push:
    branches: [main]
    # 只有真正影响镜像内容的改动才重建：工作流本身、Dockerfile、构建上下文
    # 白名单（见 .dockerignore）里的源码与面板静态文件。README / compose /
    # 资产图这些不进镜像，改了没必要重编十几分钟。
    paths:
      - '.github/workflows/docker.yml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'desktop-tauri/src-tauri/**'
      - 'desktop-tauri/ui/**'

permissions:
  contents: read

env:
  UPSTREAM: aimod-cc/agent2api

jobs:
  # ── 解析版本 + 探测镜像是否已存在 ─────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # 探测已有镜像要用 token 登录 GHCR（包若为私有，匿名探测会失败）
      packages: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}
      tags: ${{ steps.resolve.outputs.tags }}
      need_build: ${{ steps.resolve.outputs.need_build }}
    steps:
      - name: 解析上游最新 tag
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
          FORCE: ${{ inputs.force }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          upstream_url="https://github.com/${UPSTREAM}.git"

          # 上游最新稳定 tag：按版本号倒序取第一个，并过滤掉 rc/beta 之类
          # 的预发布 tag（它们不匹配 vX.Y.Z 的纯数字三段式）。
          latest=$(git ls-remote --tags --refs --sort=-v:refname "$upstream_url" 'refs/tags/v*' \
                   | sed 's#.*refs/tags/##' \
                   | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                   | head -1)
          if [ -z "$latest" ]; then
            echo "::error::未能从 $UPSTREAM 解析出任何稳定 tag"
            exit 1
          fi

          # 手动指定则用指定值；否则用上游最新
          version="${INPUT_VERSION:-$latest}"
          if ! printf '%s' "$version" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::版本号格式不对：$version（应形如 v2.7.0）"
            exit 1
          fi

          # 上游 tag 指向的 commit：先按 annotated tag 解引用（^{}），拿不到
          # 再退回直接读（lightweight tag 只有一行）。只用于日志对照 —— 实际
          # 构建的是本仓库的源码，两者不一致要看得见。
          upstream_sha=$(git ls-remote "$upstream_url" "refs/tags/${version}^{}" | cut -f1)
          if [ -z "$upstream_sha" ]; then
            upstream_sha=$(git ls-remote "$upstream_url" "refs/tags/${version}" | cut -f1)
          fi

          # 本次实际构建的 commit = 触发事件检出的那个
          built_sha="$GITHUB_SHA"

          # 镜像名必须是全小写，GITHUB_REPOSITORY 里的 owner 可能带大写。
          # 用 tr 而不是 ${VAR,,}：后者是 bash 4+ 语法，本机 bash 3.2 跑不了，
          # 换成 tr 这段逻辑在哪都能本地复现调试。
          base="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"

          # 推三个标签：带 v 的完整版本、不带 v 的同版本、以及 latest。
          # latest 只在该版本就是上游最新时才推 —— 手动构建旧版本时不应该
          # 把 latest 回退到旧版本上。
          tags="${base}:${version}"
          tags="${tags}"$'\n'"${base}:${version#v}"
          if [ "$version" = "$latest" ]; then
            tags="${tags}"$'\n'"${base}:latest"
          fi

          # 探测该版本镜像是否已经存在。登录失败不致命（公开包可匿名读），
          # 所以吞掉登录错误继续探测。
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null 2>&1 || true
          if docker manifest inspect "${base}:${version}" >/dev/null 2>&1; then
            exists=true
          else
            exists=false
          fi

          # push 触发一律重建：那次改动本身就说明构建输入变了（源码 /
          # Dockerfile），即便 GHCR 上已有同版本镜像也得被覆盖。定时与手动
          # 触发才适用「已有则跳过」的幂等。
          need_build=true
          if [ "$EVENT" != "push" ] && [ "$exists" = true ] && [ "$FORCE" != "true" ]; then
            need_build=false
          fi

          echo "上游最新 tag : $latest"
          echo "本次构建版本 : $version"
          echo "触发方式     : $EVENT"
          echo "镜像已存在   : $exists"
          echo "需要构建     : $need_build"
          echo "上游 tag commit  : $upstream_sha"
          echo "本次构建 commit  : $built_sha"
          if [ "$upstream_sha" != "$built_sha" ]; then
            echo "::warning::本次构建的 commit 与上游 ${version} 的 commit 不一致，镜像 = 上游该版本 + 本仓库补丁"
          fi

          {
            echo "version=$version"
            echo "sha=$built_sha"
            echo "need_build=$need_build"
            echo "tags<<TAGS_EOF"
            echo "$tags"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

  # ── 构建并推送多架构镜像 ─────────────────────────────────────
  build:
    needs: prepare
    if: needs.prepare.outputs.need_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # 检出本仓库、而不是上游的 tag —— 版本号虽然取上游，但源码必须用本仓库
      # 的，否则对 Dockerfile 的修正（例如漏掉 ARG TARGETARCH 导致 arm64 镜像
      # 里装 x86-64 二进制）永远进不了镜像，会被上游原版覆盖回去。
      - name: 检出本仓库源码
        uses: actions/checkout@v7

      - name: 准备 QEMU（运行时阶段 arm64 要跑 apt-get）
        uses: docker/setup-qemu-action@v4

      - name: 准备 buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.prepare.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
          # 不生成 provenance/SBOM attestation：多出来的 attestation manifest
          # 会让部分较旧的 Docker 客户端 pull 时报 unknown manifest，收益
          # 不抵兼容性代价。
          provenance: false
          # 缓存整个 Rust 依赖树（Dockerfile 里有专门的桩依赖层）。
          # 命中后构建从十几分钟降到几分钟。
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 把 compose 指向新镜像 ────────────────────────────────────
  # 镜像已存在（跳过构建）时也要跑：构建可能早已完成，只是 compose 还没跟上。
  # 但构建失败时不能跑 —— 否则 compose 会指向一个并不存在的镜像。
  sync-compose:
    needs: [prepare, build]
    if: ${{ always() && needs.prepare.result == 'success'
            && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: 同步镜像版本
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          base="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"

          # 只改 image 行的标签部分，其余（注释、端口、环境变量、卷）原样保留
          sed -i -E "s#^([[:space:]]*image:[[:space:]]*)${base}:[^[:space:]]*#\1${base}:${VERSION}#" docker-compose.yml

          # sed 匹配不到就静默什么都不做，所以这里必须回读确认。
          # 用 -F 做固定字符串匹配：镜像名里的 '.' 当正则用会变成通配，
          # 校验就成了摆设。
          grep -Fq "image: ${base}:${VERSION}" docker-compose.yml \
            || { echo "::error::docker-compose.yml 里没找到形如 'image: ${base}:<版本>' 的行"; exit 1; }

          git diff --stat -- docker-compose.yml || true

      - name: 提交改动
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if git diff --quiet -- docker-compose.yml; then
            echo "docker-compose.yml 已指向 $VERSION，无需提交"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docker-compose.yml
          git commit -m "chore(docker): 镜像版本同步到 ${VERSION} [skip ci]"
          git push
